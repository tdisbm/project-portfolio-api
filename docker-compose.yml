services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio-app
      POSTGRES_USER: portfolio-app-user
      POSTGRES_PASSWORD: hackme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio-app-user -d portfolio-app"]
      interval: 5s
      timeout: 5s
      retries: 5

  project-portfolio-api:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: portfolio-app
      DB_USER: portfolio-app-user
      DB_PASSWORD: hackme
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSL_MODE: disable
      SECURE_SSL_REDIRECT: "False"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4"

  project-portfolio-app:
    build: ./frontend/project-portfolio-app
    depends_on:
      - project-portfolio-api

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - project-portfolio-api

volumes:
  postgres_data:
