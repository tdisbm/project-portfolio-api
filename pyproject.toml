[project]
name = "project-portfolio-api"
version = "0.1.0"
description = "Project portfolio API built with Django"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.34",
    "python-decouple>=3.8",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "ruff>=0.11",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2",
    "factory-boy>=3.3",
    "model-bakery>=1.20",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "DJ"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
