<div class="login-container">
  <div class="login-card mat-elevation-z4">
    <h1 class="login-title">Sign In</h1>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password"
               [type]="hidePassword() ? 'password' : 'text'"
               autocomplete="current-password" />
        <button matIconSuffix mat-icon-button type="button"
                (click)="hidePassword.set(!hidePassword())">
          <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit"
              class="submit-btn" [disabled]="form.invalid || loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          Sign In
        }
      </button>
    </form>

    <p class="switch-link">Don't have an account? <a routerLink="/register">Sign up</a></p>
  </div>
</div>
